# The text the device shows, in English.
#
# Identifiers are <screen>.<thing>. A translation is a copy of this file under its language tag; a
# line it does not carry falls back to the English here rather than showing the identifier.
#
# Labels sit in a row beside their value and are cut with an ellipsis when they do not fit, so short
# is better than complete. A hint is the line under a label and says what the thing is, not what it
# does for you.

# What this language calls itself, for the row that picks it. In its own language rather than in
# English: somebody who cannot read the current language is looking for a word they recognise.
