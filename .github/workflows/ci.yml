name: ci

on:
  pull_request:
  push:
    branches: [main]

env:
  GOWORK: "off"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: install Android NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;30.0.16248370"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: vet
        run: make vet

      - name: test
        run: make test

      - name: test -race
        run: make test-race
        env:
          CGO_ENABLED: 1

      - name: native tests
        run: make test-native

      - name: cross-compile for the device
        run: make build-lanovod

      - name: build without the assembly
        run: make build-lanovod TAGS=noasm

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          install-only: true

      - name: format check
        run: golangci-lint fmt --diff

      - name: lint
        run: golangci-lint run
