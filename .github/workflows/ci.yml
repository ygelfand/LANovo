name: ci

on:
  pull_request:
  push:
    branches: [main]

env:
  GOWORK: "off"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        id: go
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ steps.go.outputs.go-version }}-check-${{ github.run_id }}
          restore-keys: go-${{ runner.os }}-${{ steps.go.outputs.go-version }}-check-

      - name: upx version
        id: upx
        run: echo "version=$(sed -n 's/^UPX_VERSION := //p' Makefile)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: bin/upx-${{ steps.upx.outputs.version }}/build/upx
          key: upx-${{ runner.os }}-${{ steps.upx.outputs.version }}

      - name: build upx
        run: make upx

      - name: install Android NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;30.0.16248370"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: vet
        run: make vet

      - name: test
        run: make test

      - name: test -race
        run: make test-race
        env:
          CGO_ENABLED: 1

      - name: native tests
        run: make test-native

      - name: cross-compile for the device
        run: make build-lanovod

      - name: build without the assembly
        run: make build-lanovod TAGS=noasm

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          install-only: true

      - name: format check
        run: golangci-lint fmt --diff

      - name: lint
        run: golangci-lint run
